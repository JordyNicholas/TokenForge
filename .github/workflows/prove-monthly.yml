# Monthly Prove automation (#131) — Platform owns the clock.
#
# Runs on a monthly schedule + manual workflow_dispatch.
# Default: artifacts only (no git commits). Developers keep using Context Guard;
# FinOps cadence is this Action / an equivalent cron.
#
# Smoke (this repo, no live billing secrets):
#   Actions → "Prove monthly" → Run workflow
#   usage_provider=fixture, run_scan=true (defaults)
#
# Live org: set repository Variables / Secrets (see docs/examples/prove-monthly.md)
#   vars.TOKENFORGE_USAGE_PROVIDER = copilot|cursor|claude
#   vars.TOKENFORGE_USAGE_ORG = GitHub org or Cursor organizationId
#   secrets: GITHUB_COPILOT_USAGE_TOKEN | CURSOR_API_KEY | ANTHROPIC_ADMIN_API_KEY

name: Prove monthly

on:
  schedule:
    # 06:00 UTC on the 2nd — prior calendar month usually has a settled bill.
    - cron: "0 6 2 * *"
  workflow_dispatch:
    inputs:
      usage_provider:
        description: "Usage provider (fixture for smoke; live needs secrets)"
        type: choice
        options:
          - fixture
          - copilot
          - cursor
          - claude
        default: fixture
      org:
        description: "Org slug / Cursor organizationId (required for copilot/cursor)"
        type: string
        required: false
        default: ""
      period:
        description: "Billing period YYYY-MM (empty = previous UTC month)"
        type: string
        required: false
        default: ""
      team:
        description: "Optional team scope for usage-sync"
        type: string
        required: false
        default: ""
      run_scan:
        description: "Also run heuristic tokenforge scan (no VS Code required)"
        type: boolean
        default: true
      scan_root:
        description: "Scan root relative to the repo (heuristic Detect feed)"
        type: string
        required: false
        default: "fixtures/noisy-app"
      fixture_file:
        description: "Fixture UsageMetrics JSON (fixture provider only)"
        type: string
        required: false
        default: "docs/schemas/examples/usage-metrics.v0.json"

permissions:
  contents: read

concurrency:
  group: prove-monthly-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prove:
    name: Scan + usage-sync → artifacts
    runs-on: ubuntu-latest
    env:
      # workflow_dispatch inputs; schedule falls back to repo Variables then safe defaults.
      USAGE_PROVIDER: ${{ github.event.inputs.usage_provider || vars.TOKENFORGE_USAGE_PROVIDER || 'fixture' }}
      USAGE_ORG: ${{ github.event.inputs.org || vars.TOKENFORGE_USAGE_ORG || '' }}
      USAGE_PERIOD: ${{ github.event.inputs.period || vars.TOKENFORGE_USAGE_PERIOD || '' }}
      USAGE_TEAM: ${{ github.event.inputs.team || vars.TOKENFORGE_USAGE_TEAM || '' }}
      RUN_SCAN: ${{ github.event.inputs.run_scan || vars.TOKENFORGE_RUN_SCAN || 'true' }}
      SCAN_ROOT: ${{ github.event.inputs.scan_root || vars.TOKENFORGE_SCAN_ROOT || 'fixtures/noisy-app' }}
      FIXTURE_FILE: ${{ github.event.inputs.fixture_file || 'docs/schemas/examples/usage-metrics.v0.json' }}
      # Live provider credentials (unused for fixture). Prefer dedicated PAT over GITHUB_TOKEN.
      GITHUB_COPILOT_USAGE_TOKEN: ${{ secrets.GITHUB_COPILOT_USAGE_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_COPILOT_USAGE_TOKEN || secrets.GITHUB_TOKEN }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      ANTHROPIC_ADMIN_API_KEY: ${{ secrets.ANTHROPIC_ADMIN_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Resolve billing period
        id: period
        run: |
          set -euo pipefail
          PERIOD="${USAGE_PERIOD}"
          if [ -z "${PERIOD}" ]; then
            # Previous UTC calendar month (GNU date on ubuntu-latest).
            PERIOD="$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)"
          fi
          echo "period=${PERIOD}" >> "$GITHUB_OUTPUT"
          echo "Using period ${PERIOD}"

      - name: Heuristic scan (optional)
        if: ${{ env.RUN_SCAN == 'true' }}
        run: |
          set -euo pipefail
          npm run tokenforge -- scan "${SCAN_ROOT}" \
            --provider generic \
            --team "${USAGE_TEAM:-platform}" \
            --json
          # Copy scan report to a stable artifact path at repo root .tokenforge/
          mkdir -p .tokenforge
          if [ -f "${SCAN_ROOT}/.tokenforge/scan-report.json" ]; then
            cp "${SCAN_ROOT}/.tokenforge/scan-report.json" .tokenforge/scan-report.json
          elif [ -f .tokenforge/scan-report.json ]; then
            true
          else
            echo "Expected scan-report.json under ${SCAN_ROOT}/.tokenforge/ or .tokenforge/" >&2
            exit 1
          fi

      - name: Usage sync
        run: |
          set -euo pipefail
          PERIOD="${{ steps.period.outputs.period }}"
          ARGS=(usage-sync . --usage-provider "${USAGE_PROVIDER}" --period "${PERIOD}")
          if [ -n "${USAGE_ORG}" ]; then
            ARGS+=(--org "${USAGE_ORG}")
          fi
          if [ -n "${USAGE_TEAM}" ]; then
            ARGS+=(--team "${USAGE_TEAM}")
          fi
          if [ "${USAGE_PROVIDER}" = "fixture" ]; then
            ARGS+=(--file "${FIXTURE_FILE}")
          fi
          npm run tokenforge -- "${ARGS[@]}"

      - name: Upload Prove artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tokenforge-prove-${{ steps.period.outputs.period }}
          path: |
            .tokenforge/scan-report.json
            .tokenforge/usage-*.json
            .tokenforge/usage-latest.json
          if-no-files-found: error
          retention-days: 90
